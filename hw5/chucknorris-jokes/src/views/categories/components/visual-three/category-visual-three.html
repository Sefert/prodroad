<div class="holder d-flex align-items-center justify-content-center">
    
    <div class="container">      
        <div class="row">
            <div class="col-lg-5 mx-auto">

                <div class="card rounded border-0 shadow-sm position-relative">
                    <div class="card-body p-5">
                        <div class="d-flex align-items-center mb-4 pb-4 border-bottom"><i class="far fa-calendar-alt fa-3x"></i>
                            <div class="ms-3">
                                <h4 class="text-uppercase fw-weight-bold mb-0">${appState.category}</h4>
                                <p class="text-gray fst-italic mb-0"></p>
                            </div>
                        </div>
                        <div class="form-check mb-3" repeat.for="joke of appState.newJokes" >
                            <label class="form-check-label" for="flexCheck1"><span class="fst-italic pl-1">${joke.value}</span></label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
