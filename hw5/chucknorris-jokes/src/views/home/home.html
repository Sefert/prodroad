<div class="container">
            <div class="row">
                 <div class="col-lg-10 mx-auto mb-4">
                    <div class="section-title text-center ">
                        <h3 class="top-c-sep">Already seen jokes</h3>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-10 mx-auto">
                    <div class="career-search mb-60">
                        <div class="filter-result">
                            <p class="mb-30 ff-montserrat">Total Jokes : xxx</p>
                            
                            <div repeat.for="joke of appState.seenJokes">
                                <div class="job-box d-md-flex align-items-center justify-content-between mb-30">
                                    <div class="job-left my-6 d-md-flex align-items-center flex-wrap">
                                        <div class="job-content">
                                            <h5 class="text-left text-md-left">${joke.categories}</h5>
                                            <ul class="d-md-flex flex-wrap ff-open-sans">
                                                <li class="mr-md-4">
                                                    <i class="zmdi mr-2"></i> ${joke.value}
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                    <div class="job-right my-4 flex-shrink-0">
                                        <a href="https://api.chucknorris.io/jokes/${joke.id}" target="_blank"  class="btn d-block w-100 d-sm-inline-block btn-light">GO to JOKE</a>
                                    </div>
                                </div>
                            <div>
                        </div>
                    </div>
