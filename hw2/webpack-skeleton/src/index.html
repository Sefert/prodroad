<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <!--<link rel="stylesheet" href="./index.css">-->
</head>
<body>
    <div class="container my-4">  

        <p>Built with <a target="_blank" href="https://mdbootstrap.com/docs/standard/">Material Design for Bootstrap</a> - free and powerful Bootstrap UI KIT</p>
        <p>Css and HTML taken from <a href="https://mdbootstrap.com/snippets/jquery/ascensus/456902#css-tab-view">CALC example</a></p>
          <hr class="mb-5"/>  
        
        
        <div class="calculator card">
        
            <input type="text" class="calculator-screen z-depth-1" value="" disabled />
        
            <div class="calculator-keys">
        
              <button type="button" id="btn+" class="operator btn btn-info" value="+">+</button>
              <button type="button" id="btn-" class="operator btn btn-info" value="-">-</button>
              <button type="button" id="btn*" class="operator btn btn-info" value="*">&times;</button>
              <button type="button" id="btn/" class="operator btn btn-info" value="/">&divide;</button>
        
              <button type="button" id="btn7" value="7" class="btn btn-light waves-effect">7</button>
              <button type="button" id="btn8" value="8" class="btn btn-light waves-effect">8</button>
              <button type="button" id="btn9" value="9" class="btn btn-light waves-effect">9</button>
        
        
              <button type="button" id="btn4" value="4" class="btn btn-light waves-effect">4</button>
              <button type="button" id="btn5" value="5" class="btn btn-light waves-effect">5</button>
              <button type="button" id="btn6" value="6" class="btn btn-light waves-effect">6</button>
        
        
              <button type="button" id="btn1" value="1" class="btn btn-light waves-effect">1</button>
              <button type="button" id="btn2" value="2" class="btn btn-light waves-effect">2</button>
              <button type="button" id="btn3" value="3" class="btn btn-light waves-effect">3</button>
        
        
              <button type="button" id="btn0" value="0" class="btn btn-light waves-effect">0</button>
              <button type="button" id="btn." class="decimal function btn btn-secondary" value=".">.</button>
              <button type="button" id="btnAlc" class="all-clear function btn btn-danger btn-sm" value="all-clear">AC</button>
        
              <button type="button" id="btnEq" class="equal-sign operator btn btn-default" value="=">=</button>
        
            </div>
          </div>
        </div>
</body>
</html>
